<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Cueca</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <h1>Jogo de Cueca</h1>
  
  <div class="placar">
    <div>Dupla 1: <span id="pontos-dupla1">0</span></div>
    <div>Dupla 2: <span id="pontos-dupla2">0</span></div>
    <div>Rodada: <span id="rodada">1</span></div>
  </div>

  <div class="mesa-cueca">
    <div class="jogador" id="jogador1">
      <h3>Você</h3>
      <div class="cartas-mao" id="mao-jogador1"></div>
    </div>

    <div class="centro-mesa">
      <div class="naipe-rodada">Naipe: <span id="naipe-atual">-</span></div>
      <div class="cartas-jogadas" id="cartas-mesa"></div>
      <button onclick="iniciarRodada()">Distribuir Cartas</button>
    </div>

    <div class="jogador" id="jogador2">
      <h3>Parceiro</h3>
      <div class="cartas-mao" id="mao-jogador2"></div>
    </div>
  </div>

  <div class="jogador" id="jogador3">
    <h3>Adversário 1</h3>
    <div class="cartas-mao" id="mao-jogador3"></div>
  </div>

  <div class="jogador" id="jogador4">
    <h3>Adversário 2</h3>
    <div class="cartas-mao" id="mao-jogador4"></div>
  </div>

  <script src="jogo.js"></script>
</body>
</html>
